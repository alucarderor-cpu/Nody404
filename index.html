<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Date Invite 💖</title>

<style>
body {
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg,#ff9a9e,#fad0c4);
  text-align:center;
  overflow:hidden;
}

.container {
  margin-top:60px;
  padding:15px;
}

button {
  padding:12px 20px;
  margin:10px;
  border:none;
  border-radius:25px;
  font-size:16px;
}

.yes { background:#ff4d6d; color:white; }
.no { background:#aaa; color:white; position:absolute; }

input, select {
  padding:10px;
  border-radius:10px;
  border:1px solid #ddd;
  margin:10px;
  width:80%;
}

.hidden { display:none; }

.avatar {
  position:fixed;
  bottom:15px;
  right:15px;
  background:white;
  padding:12px;
  border-radius:15px;
  width:180px;
  font-size:13px;
  box-shadow:0 0 10px rgba(0,0,0,0.2);
}

/* قلوب */
.heart {
  position: fixed;
  font-size:20px;
  animation: float 4s linear infinite;
}

@keyframes float {
  0% {transform: translateY(0);}
  100% {transform: translateY(-600px); opacity:0;}
}
</style>
</head>

<body>

<div class="avatar" id="ai">Hey… I'm watching 😏</div>

<!-- اسم -->
<div class="container" id="step0">
  <h1>Hey Nody 💖</h1>
  <h2>Type your name to Unlock</h2>
  <input id="name">
  <br>
  <button class="yes" onclick="nextStep(1)">Continue</button>
</div>

<!-- لعبة -->
<div class="container hidden" id="game">
  <h2>Catch the heart 💖</h2>
  <div id="heartBtn" style="font-size:50px; cursor:pointer;">💖</div>
</div>

<!-- السؤال -->
<div class="container hidden" id="step1">
  <h2 id="nameTitle"></h2>
  <p>Would you go out with me? 💕</p>
  <button class="yes" id="yesBtn" onclick="nextStep(3)">Yes 😍</button>
  <button class="no" id="noBtn">No 😢</button>
</div>

<!-- باقي الفورم -->
<div class="container hidden" id="step2">
  <h2>Pick a date 📅</h2>
  <input type="date" id="date">
  <br>
  <button onclick="nextStep(4)">Next</button>
</div>

<div class="container hidden" id="step3">
  <h2>Pick time ⏰</h2>
  <input type="time" id="time">
  <br>
  <button onclick="nextStep(5)">Next</button>
</div>

<div class="container hidden" id="step4">
  <h2>Food 🍔</h2>
  <select id="food">
    <option>Burger 🍔</option>
    <option>Pizza 🍕</option>
    <option>Sushi 🍣</option>
    <option>Pasta 🍝</option>
    <option>Other</option>
  </select>
  <br>
  <input placeholder="Or type what you want 😏" id="customFood">
  <br>
  <button onclick="nextStep(6)">Next</button>
</div>

<div class="container hidden" id="step5">
  <h2>Where? 📍</h2>
  <input id="place">
  <br>
  <button onclick="showSummary()">Finish</button>
</div>

<div class="container hidden" id="summary">
  <h2>Done 💖</h2>
  <p id="result"></p>
  <button onclick="sendWhatsApp()">Send 💌</button>
</div>

<script>

// قلوب طايرة
setInterval(()=>{
  const heart = document.createElement("div");
  heart.innerText = "💖";
  heart.classList.add("heart");
  heart.style.left = Math.random()*100 + "%";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),4000);
},500);

// AI كلام
function speak(text){
  document.getElementById("ai").innerText = text;
}

// 🎮 لعبة القلب (سهلة)
const heartBtn = document.getElementById("heartBtn");
let tries = 0;

heartBtn.style.transition = "0.3s";

heartBtn.addEventListener("touchstart", moveHeart);
heartBtn.addEventListener("mouseover", moveHeart);

function moveHeart(){

  tries++;

  if(tries > 6){
    speak("خلاص كسبتي 😍💖");
    return;
  }

  setTimeout(()=>{
    heartBtn.style.position="absolute";
    heartBtn.style.left = (Math.random()*50 + 20) + "%";
    heartBtn.style.top = (Math.random()*40 + 20) + "%";
  },200);
}

heartBtn.addEventListener("click", ()=>{
  speak("شطورة 😍💘");
  nextStep(2);
});

// زر NO
const noBtn = document.getElementById("noBtn");

const noMessages = [
  "Are you sure? 😢",
  "Think again 😏",
  "Don't break my heart 💔",
  "Try YES 😌"
];

function moveNo(){
  noBtn.style.left = Math.random()*70+"%";
  noBtn.style.top = Math.random()*60+"%";
  speak(noMessages[Math.floor(Math.random()*noMessages.length)]);
}

noBtn.addEventListener("mouseover", moveNo);
noBtn.addEventListener("touchstart", moveNo);

// YES
const yesBtn = document.getElementById("yesBtn");

const yesMessages = [
  "Click me 😍",
  "Yesss 💖",
  "Do it 😉",
  "Good choice 😏"
];

yesBtn.addEventListener("mouseover", ()=>{
  speak(yesMessages[Math.floor(Math.random()*yesMessages.length)]);
});

yesBtn.addEventListener("touchstart", ()=>{
  speak("Tap it 😍");
});

// 🔥 التنقل (متظبط 100%)
function nextStep(step){
  document.querySelectorAll(".container").forEach(el=>el.classList.add("hidden"));

  if(step === 1){
    document.getElementById("game").classList.remove("hidden");
    speak("Catch it first 😈");
    return;
  }

  if(step === 2){
    const name = document.getElementById("name").value;
    document.getElementById("nameTitle").innerText = name + "... be honest 😏";
    document.getElementById("step1").classList.remove("hidden");
    return;
  }

  if(step === 3){
    document.getElementById("step2").classList.remove("hidden");
  }
  else if(step === 4){
    document.getElementById("step3").classList.remove("hidden");
  }
  else if(step === 5){
    document.getElementById("step4").classList.remove("hidden");
  }
  else if(step === 6){
    document.getElementById("step5").classList.remove("hidden");
  }
}

// النتيجة
function showSummary(){
  const name = document.getElementById("name").value;
  const date = document.getElementById("date").value;
  const time = document.getElementById("time").value;
  const food = document.getElementById("customFood").value || document.getElementById("food").value;
  const place = document.getElementById("place").value;

  const text = `
Name: ${name}
Date: ${date}
Time: ${time}
Food: ${food}
Place: ${place}
  `;

  document.getElementById("result").innerText = text;

  document.querySelectorAll(".container").forEach(el=>el.classList.add("hidden"));
  document.getElementById("summary").classList.remove("hidden");

  speak("Perfect 💖");
}

// واتساب
function sendWhatsApp(){
  const result = document.getElementById("result").innerText;
  const url = "https://wa.me/+201009996014?text=" + encodeURIComponent(result);
  window.open(url, "_blank");
}

</script>

</body>
</html>
